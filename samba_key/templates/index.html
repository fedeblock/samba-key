<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Samba Key · {{ t.title }}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#form">{{ t.skip }}</a>
<main>
<nav aria-label="{{ t.language }}">
<a href="/?lang=en" lang="en"{% if lang == 'en' %} aria-current="page"{% endif %}>English</a> ·
<a href="/?lang=es" lang="es"{% if lang == 'es' %} aria-current="page"{% endif %}>Español</a>
</nav>
<p class="eyebrow">SAMBA KEY</p>
<h1>{{ t.title }}</h1>
<p>{{ t.description }}</p>
{% if message %}<p id="status" role="status" aria-live="polite" class="notice{% if message_success %} notice--success{% endif %}">{% if message_success %}<span class="notice-icon" aria-hidden="true">✓</span>{% endif %}<span>{{ message }}</span></p>{% endif %}
<form id="form" method="post" novalidate>
<input type="hidden" name="csrf" value="{{ csrf }}">
<fieldset>
<legend class="visually-hidden">Samba Key</legend>
<p class="field">
<label for="username">{{ t.user }}</label>
<input id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false"
       required maxlength="64" inputmode="text">
</p>
<p class="field">
<label for="old_password">{{ t.old }}</label>
<span class="password">
<input id="old_password" name="old_password" type="password" autocomplete="current-password"
       required>
<button type="button" class="reveal" data-target="old_password" aria-pressed="false">
<span class="show" data-i18n="show">{{ t.show }}</span>
<span class="hide visually-hidden" data-i18n="hide">{{ t.hide }}</span>
</button>
</span>
</p>
<p class="field">
<label for="new_password">{{ t.new }}</label>
<span class="password">
<input id="new_password" name="new_password" type="password" autocomplete="new-password"
       required minlength="{{ min_length }}">
<button type="button" class="reveal" data-target="new_password" aria-pressed="false">
<span class="show" data-i18n="show">{{ t.show }}</span>
<span class="hide visually-hidden" data-i18n="hide">{{ t.hide }}</span>
</button>
</span>
</p>
<p class="field">
<label for="confirm_password">{{ t.confirm }}</label>
<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password"
       required minlength="{{ min_length }}">
</p>
<button type="submit">{{ t.button }}</button>
</fieldset>
</form>
{% if enable_recovery %}
<p class="hint"><a href="/recovery?lang={{ lang }}">{{ t.recovery_link }}</a></p>
{% else %}
<p class="hint">{{ t.help }}</p>
{% endif %}
</main>
</body>
</html>
