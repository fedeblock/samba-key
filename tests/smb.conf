[global]
   workgroup = WORKGROUP
   security = user
   server string = samba-key-integration
   map to guest = never
   guest account = nobody
   # No password-length restriction: the test server must accept both short and
   # very long test passwords. Modern Samba (4.x) enforces length via PAM; with
   # "obey pam restrictions = no" no length policy is applied. (Do not use this
   # configuration for production.)
   obey pam restrictions = no
   unix password sync = no
   log file = /tmp/samba.log
   log level = 2

   # No public shares. A private share exists only so smbd has something to
   # serve; it is not browsable and is not writable by guests.
   browseable = no
   public = no

[sktest]
   path = /data
   browseable = no
   writable = yes
   guest ok = no
   create mask = 0600
   directory mask = 0700

# Deliberately guest-accepting share, used ONLY as the negative control that
# proves the canary detects a misconfigured verifier. Do not use in production.
[skguest]
   path = /data
   browseable = no
   writable = no
   guest ok = yes
